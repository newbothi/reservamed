# NGINX: puerta de entrada única. Corre sin root (imagen nginx-unprivileged):
# escucha en 8080/8443 dentro del contenedor; compose publica 80 y 443.
#   /              → portal de pacientes (React estático)
#   /backoffice/   → backoffice de la clínica (React estático)
#   /bff/          → BFF NestJS (solo lo usa el portal)
#   /api/ /fhir/   → API Core ASP.NET Core (backoffice e integraciones)
# La página de Webpay simulado NO se publica (hallazgo C2): en Docker se paga en Transbank integración.

# ---- Límites por IP (A2/A8 se completan en la API en F2) ----
limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
limit_req_status  429;
limit_conn_status 429;

upstream bff      { server bff:3000; }
upstream api_core { server api-core:8080; }

# ---- HTTP: solo redirige a HTTPS (C4) ----
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    return 444;   # Host desconocido: cerrar sin responder
}

server {
    listen 8080;
    server_name reservamed.localhost localhost;
    server_tokens off;
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
# SNI desconocido o sin SNI: se rechaza el handshake (evita ataques de cabecera Host).
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name reservamed.localhost localhost;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/reservamed.crt;
    ssl_certificate_key /etc/nginx/certs/reservamed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/seguridad.conf;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn conexiones 50;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # A4: NGINX es el borde; REEMPLAZA X-Forwarded-For con la IP que ve (no anexa la del cliente).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Fuerza bruta en login y registro
    location = /bff/auth/login    { limit_req zone=login burst=5 nodelay; proxy_pass http://bff; }
    location = /bff/auth/registro { limit_req zone=login burst=5 nodelay; proxy_pass http://bff; }
    location = /api/auth/login    { limit_req zone=login burst=5 nodelay; proxy_pass http://api_core; }
    location = /api/auth/registro { limit_req zone=login burst=5 nodelay; proxy_pass http://api_core; }

    location /bff/  { limit_req zone=api burst=40 nodelay; proxy_pass http://bff; }
    location /api/  { limit_req zone=api burst=40 nodelay; proxy_pass http://api_core; }
    location /fhir/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api_core; }
    location = /health { proxy_pass http://api_core/health; }

    # Nada de archivos ocultos (.git, .env…)
    location ~ /\. { return 404; }

    # ^~ evita que otras reglas capturen los archivos del backoffice
    location ^~ /backoffice/ {
        alias /usr/share/nginx/backoffice/;
        try_files $uri $uri/ /backoffice/index.html;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/portal;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/portal;
        try_files $uri $uri/ /index.html;
    }
}
