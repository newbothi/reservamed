# NGINX: puerta de entrada única. Corre sin root (imagen nginx-unprivileged):
# escucha en 8080/8443 dentro del contenedor; compose publica 80 y 443.
#   /              → portal de pacientes (React estático)
#   /backoffice/   → backoffice de la clínica (React estático)
#   /bff/          → BFF NestJS (portal y backoffice; desde F2 es la única puerta a la API)
#   /api/ /fhir/   → 404 (la API Core ya no se publica)
# La página de Webpay simulado NO se publica (hallazgo C2): en Docker se paga en Transbank integración.

# ---- Límites por IP (A2/A8 se completan en la API en F2) ----
limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;
limit_req_status  429;
limit_conn_status 429;

# ---- A9: el registro de accesos no guarda la query string ni el referer ----
# (ahí viajan el token de activación de cuenta y el token_ws de Webpay). $ruta_registro es la ruta
# pedida sin "?…" ($uri no sirve: cambia a /index.html con try_files).
map $request_uri $ruta_registro {
    default            $request_uri;
    "~^(?<ruta>[^?]*)" $ruta;
}
# Se declara en cada server: así reemplaza al formato "main" de la imagen, que guarda $request completo.
log_format privado '$remote_addr [$time_local] "$request_method $ruta_registro $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';

# F5 (ASVS V9.2.2): NGINX habla HTTPS también hacia adentro y valida el certificado de cada
# servicio contra la CA local (certs/ca.pem) y su nombre (bff, api-core).
upstream bff      { server bff:3443; }
upstream api_core { server api-core:8443; }

# ---- HTTP: solo redirige a HTTPS (C4) ----
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout privado;
    return 444;   # Host desconocido: cerrar sin responder
}

server {
    listen 8080;
    server_name reservamed.localhost localhost;
    server_tokens off;
    access_log /dev/stdout privado;
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
# Servidor por defecto en 443: algunos clientes (Java, y navegadores con "localhost") no envían SNI,
# así que no se rechaza el handshake. Un Host ajeno recibe 421 y la app nunca usa $host para armar URLs.
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name reservamed.localhost localhost;
    server_tokens off;
    access_log /dev/stdout privado;

    if ($host !~* ^(reservamed\.localhost|localhost)$) { return 421; }

    ssl_certificate     /etc/nginx/certs/reservamed.crt;
    ssl_certificate_key /etc/nginx/certs/reservamed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/seguridad.conf;

    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn conexiones 50;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # A4: NGINX es el borde; REEMPLAZA X-Forwarded-For con la IP que ve (no anexa la del cliente).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
    proxy_ssl_server_name         on;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse       on;
    proxy_ssl_name                bff;

    # Fuerza bruta en login, segundo factor y registro (la API además limita por IP y bloquea la cuenta)
    location = /bff/auth/login       { limit_req zone=login burst=5 nodelay; proxy_pass https://bff; }
    location = /bff/auth/registro    { limit_req zone=login burst=5 nodelay; proxy_pass https://bff; }
    location = /bff/bo/auth/login    { limit_req zone=login burst=5 nodelay; proxy_pass https://bff; }
    location = /bff/bo/auth/totp     { limit_req zone=login burst=5 nodelay; proxy_pass https://bff; }

    location /bff/  { limit_req zone=api burst=40 nodelay; proxy_pass https://bff; }

    # Fase 2 (A1/A2): la API Core ya no se publica. Portal y backoffice entran solo por el BFF,
    # que guarda los tokens en una cookie HttpOnly. /fhir queda accesible vía /bff/bo/fhir/.
    location /api/  { return 404; }
    location /fhir/ { return 404; }
    location = /health { proxy_ssl_name api-core; proxy_pass https://api_core/health; }

    # Nada de archivos ocultos (.git, .env…)
    location ~ /\. { return 404; }

    # ^~ evita que otras reglas capturen los archivos del backoffice
    location ^~ /backoffice/ {
        alias /usr/share/nginx/backoffice/;
        try_files $uri $uri/ /backoffice/index.html;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/portal;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/portal;
        try_files $uri $uri/ /index.html;
    }
}
