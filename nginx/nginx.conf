# NGINX: puerta de entrada única.
#   /              → portal de pacientes (React estático)
#   /backoffice/   → backoffice de la clínica (React estático)
#   /bff/          → BFF NestJS (sólo lo usa el portal)
#   /api/ /fhir/   → API Core ASP.NET Core (backoffice e integraciones)
#   /webpay-mock/  → página de pago simulada (en producción sería Transbank)

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream bff      { server bff:3000; }
upstream api_core { server api-core:8080; }

server {
    listen 80;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Límite más estricto para intentos de login (fuerza bruta)
    location = /bff/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://bff; }
    location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api_core; }

    location /bff/         { proxy_pass http://bff; }
    location /api/         { proxy_pass http://api_core; }
    location /fhir/        { proxy_pass http://api_core; }
    location /webpay-mock/ { proxy_pass http://api_core; }
    location = /health     { proxy_pass http://api_core/health; }

    # ^~ evita que otras reglas capturen los archivos del backoffice
    location ^~ /backoffice/ {
        alias /usr/share/nginx/backoffice/;
        try_files $uri $uri/ /backoffice/index.html;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/portal;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/portal;
        try_files $uri $uri/ /index.html;
    }
}
