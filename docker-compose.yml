# ReservaMed — levanta todo el sistema:  docker compose up --build
#   Portal:      https://reservamed.localhost
#   Backoffice:  https://reservamed.localhost/backoffice/
#
# Antes, una vez:
#   1. scripts/generar-certificados.ps1   (HTTPS local con mkcert; en Linux/macOS: .sh)
#   2. scripts/configurar-secretos.ps1    (claves aleatorias en .env)
# Ningún secreto tiene valor por defecto: si falta uno, compose se detiene con un mensaje.
#
# F5 (ASVS V6.4.1 y V9.2.2):
#   - Los secretos de la aplicación son Docker secrets (archivos en /run/secrets, carpeta secretos/
#     generada por configurar-secretos.ps1): no aparecen en "docker inspect" ni en el entorno del
#     proceso. SQL Server y RabbitMQ solo aceptan la clave inicial por variable (limitación de sus
#     imágenes oficiales): esa clave es la de administración y ningún servicio de la app la usa.
#   - Todo el tráfico interno va cifrado y con el certificado verificado contra la CA local:
#     NGINX→BFF→API (HTTPS), API→ml-service (HTTPS), API/Worker/ml→SQL Server (TLS, certificado
#     fijado) y AMQPS/HTTPS hacia RabbitMQ.
#
# Redes (hallazgos A4, A5):
#   app    — NGINX, BFF y API Core. NGINX y el BFF tienen IP fija: son los únicos proxies en
#            los que confía la API para X-Forwarded-For. Solo NGINX publica puertos (80 y 443).
#   datos  — interna, sin salida a Internet ni puertos publicados: SQL Server, RabbitMQ,
#            Worker y ml-service. Para inspeccionarlos: docker-compose.depuracion.yml.
#   correo — API Core y Mailpit (buzón de pruebas). La bandeja se ve SOLO desde este PC:
#            http://127.0.0.1:8025 (correos de activación de cuenta).

name: reservamed

x-endurecido: &endurecido
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

x-solo-lectura: &solo_lectura
  read_only: true
  tmpfs: ["/tmp"]

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Defina SA_PASSWORD en .env}
      MSSQL_PID: Developer
      TZ: America/Santiago
    networks: [datos]
    volumes:
      - sqldata:/var/opt/mssql
      - ./infra/sqlserver/mssql.conf:/var/opt/mssql/mssql.conf:ro
      - ./certs/sqlserver.crt:/etc/ssl/rm/sqlserver.crt:ro
      - ./certs/sqlserver.key:/etc/ssl/rm/sqlserver.key:ro
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  # Crea la base (una vez) y los usuarios por servicio (en cada arranque). Único que usa sa.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    depends_on:
      sqlserver: { condition: service_healthy }
    # F4 (M7): SQL_TDE_PASS es la clave de la llave maestra de SQL Server (TDE y respaldos).
    secrets: [SA_PASSWORD, SQL_API_PASS, SQL_WORKER_PASS, SQL_ML_PASS, SQL_ML_SEED_PASS, SQL_TDE_PASS]
    networks: [datos]
    volumes: ["./db:/scripts:ro"]
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:54ef5ff505352c1beef05a97ee9bd6ab95b3559a76629ba0119b1d63d8d6e4b2
    environment:
      # Administrador: solo para la consola y rabbit-init; no tiene permisos en el vhost de la app.
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Defina RABBIT_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?Defina RABBIT_PASS en .env}
    networks: [datos]
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-reservamed.conf:ro
      - ./certs/ca.pem:/etc/rabbitmq/certs/ca.pem:ro
      - ./certs/rabbitmq.crt:/etc/rabbitmq/certs/rabbitmq.crt:ro
      - ./certs/rabbitmq.key:/etc/rabbitmq/certs/rabbitmq.key:ro
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5671"]
      interval: 10s
      retries: 12
      start_period: 20s

  # Vhost "reservamed" y un usuario por servicio con permisos mínimos (A5/M9).
  rabbit-init:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBIT_USER: ${RABBIT_USER}
    secrets: [RABBIT_PASS, RABBIT_API_PASS, RABBIT_WORKER_PASS, RABBIT_ML_PASS]
    networks: [datos]
    volumes:
      - ./infra/rabbitmq/init.sh:/init.sh:ro
      - ./certs/ca.pem:/certs/ca.pem:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    <<: *endurecido
    restart: "no"

  api-core:
    build: { context: ./api-core, dockerfile: Dockerfile.api }
    depends_on:
      db-init: { condition: service_completed_successfully }
      rabbit-init: { condition: service_completed_successfully }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # F5: HTTPS interno (NGINX y el BFF validan este certificado contra la CA local).
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /certs/api-core.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /certs/api-core.key
      ConnectionStrings__ReservaMed: "Server=sqlserver;Database=ReservaMed;User Id=rm_api;Encrypt=Mandatory;TrustServerCertificate=False;ServerCertificate=/certs/sqlserver.crt"
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: rm_api
      RabbitMq__VirtualHost: reservamed
      RabbitMq__Tls: "true"
      RabbitMq__CaCert: /certs/ca.pem
      Seguridad__UrlPortal: https://reservamed.localhost
      Correo__Modo: Smtp
      Correo__Host: mailpit
      Correo__Puerto: "1025"
      # C2: Webpay real en ambiente de integración de Transbank (tarjetas de prueba).
      Webpay__Modo: Integracion
      Webpay__ReturnUrl: https://reservamed.localhost/pago/retorno
      # A4: solo NGINX y el BFF pueden informar la IP del cliente.
      Proxy__IpsConfiables__0: 172.30.1.10
      Proxy__IpsConfiables__1: 172.30.1.20
      Ml__Url: https://ml-service:8443
      Ml__CaCert: /certs/ca.pem
    # Secretos como archivos con el nombre de la clave de configuración (Jwt__Key → Jwt:Key).
    # F2: TotpClave cifra los secretos TOTP del personal (A2); F3 (C3): Huella valida los lectores.
    secrets:
      - { source: JWT_KEY, target: Jwt__Key }
      - { source: TOTP_KEY, target: Seguridad__TotpClave }
      - { source: HUELLA_KEY, target: Huella__Clave }
      - { source: WEBPAY_API_KEY, target: Webpay__ApiKey }
      - { source: ML_API_KEY, target: Ml__ApiKey }
      - { source: RABBIT_API_PASS, target: RabbitMq__Clave }
      - { source: SQL_API_PASS, target: Sql__Clave }
    networks:
      app: { ipv4_address: 172.30.1.30 }
      datos: {}
      correo: {}
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/sqlserver.crt:/certs/sqlserver.crt:ro
      - ./certs/api-core.crt:/certs/api-core.crt:ro
      - ./certs/api-core.key:/certs/api-core.key:ro
    <<: [*endurecido, *solo_lectura]

  worker:
    build: { context: ./api-core, dockerfile: Dockerfile.worker }
    depends_on:
      db-init: { condition: service_completed_successfully }
      rabbit-init: { condition: service_completed_successfully }
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__ReservaMed: "Server=sqlserver;Database=ReservaMed;User Id=rm_worker;Encrypt=Mandatory;TrustServerCertificate=False;ServerCertificate=/certs/sqlserver.crt"
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: rm_worker
      RabbitMq__VirtualHost: reservamed
      RabbitMq__Tls: "true"
      RabbitMq__CaCert: /certs/ca.pem
    secrets:
      - { source: RABBIT_WORKER_PASS, target: RabbitMq__Clave }
      - { source: SQL_WORKER_PASS, target: Sql__Clave }
    networks: [datos]
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/sqlserver.crt:/certs/sqlserver.crt:ro
    <<: [*endurecido, *solo_lectura]

  # Primera vez: historial sintético y primer modelo. Usuario rm_ml_seed (inserta pacientes y citas sintéticas).
  ml-bootstrap:
    build: ./ml-service
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ML_DB: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver;DATABASE=ReservaMed;Encrypt=yes;TrustServerCertificate=no;UID=rm_ml_seed"
      SSL_CERT_FILE: /certs/ca.pem   # F5: el driver ODBC valida el TLS de SQL Server con la CA local
      ML_CONSUMIR_EVENTOS: "false"
    secrets:
      - ML_API_KEY
      - { source: SQL_ML_SEED_PASS, target: ML_DB_PASS }
    networks: [datos]
    volumes:
      - modelos:/data/modelos
      - ./certs/ca.pem:/certs/ca.pem:ro
    <<: [*endurecido, *solo_lectura]
    restart: "no"

  # ml-service en ejecución: usuario rm_ml (lee lo necesario, escribe solo sus tablas). Sin puertos publicados.
  ml-service:
    build: ./ml-service
    depends_on:
      ml-bootstrap: { condition: service_completed_successfully }
      rabbit-init: { condition: service_completed_successfully }
    environment:
      ML_DB: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver;DATABASE=ReservaMed;Encrypt=yes;TrustServerCertificate=no;UID=rm_ml"
      SSL_CERT_FILE: /certs/ca.pem   # la red "datos" no sale a Internet: la CA local basta
      ML_RABBIT_URL: amqps://rm_ml@rabbitmq:5671/reservamed
      ML_RABBIT_CA: /certs/ca.pem
    secrets:
      - ML_API_KEY
      - { source: SQL_ML_PASS, target: ML_DB_PASS }
      - { source: RABBIT_ML_PASS, target: ML_RABBIT_PASS }
    # F5: HTTPS interno; la API valida el certificado contra la CA local.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8443",
              "--ssl-certfile", "/certs/ml-service.crt", "--ssl-keyfile", "/certs/ml-service.key"]
    networks: [datos]
    volumes:
      - modelos:/data/modelos
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/ml-service.crt:/certs/ml-service.crt:ro
      - ./certs/ml-service.key:/certs/ml-service.key:ro
    <<: [*endurecido, *solo_lectura]

  bff:
    build: ./bff
    depends_on: [api-core]
    environment:
      API_CORE_URL: https://api-core:8443
      NODE_EXTRA_CA_CERTS: /certs/ca.pem   # valida el HTTPS de la API con la CA local
      PORT: "3443"
      BFF_TLS_CERT: /certs/bff.crt
      BFF_TLS_KEY: /certs/bff.key
      TRUSTED_PROXIES: 172.30.1.10   # A4: solo NGINX
      BFF_ORIGENES: https://reservamed.localhost,https://localhost
      # F3 (C3): el BFF hace de lector biométrico simulado de cada sede (en producción, el dispositivo).
      HUELLA_LECTORES: "1:LECTOR-PROV-01,2:LECTOR-LC-01"
    # F2 (A1): BFF_SESSION_KEY sella la cookie de sesión; HUELLA_KEY firma como lector simulado (C3).
    secrets: [BFF_SESSION_KEY, HUELLA_KEY]
    networks:
      app: { ipv4_address: 172.30.1.20 }
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/bff.crt:/certs/bff.crt:ro
      - ./certs/bff.key:/certs/bff.key:ro
    <<: [*endurecido, *solo_lectura]

  # Buzón SMTP de pruebas: atrapa todos los correos; no envía nada a Internet.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_MAX_MESSAGES: "500"
    user: "65534:65534"   # nobody: no necesita root (puertos > 1024, datos en /tmp)
    networks: [correo]
    # Solo en la interfaz local del PC: nadie más en la red ve los correos.
    ports: ["127.0.0.1:8025:8025"]
    <<: [*endurecido, *solo_lectura]

  nginx:
    build: { context: ., dockerfile: nginx/Dockerfile }
    depends_on: [bff, api-core]
    # HTTP_PORT: si Windows tiene reservado el 80 (IIS, Hyper-V), use otro en .env, p. ej. HTTP_PORT=8081.
    # Solo redirige a https://; el sitio se usa siempre por el 443.
    ports: ["${HTTP_PORT:-80}:8080", "443:8443"]
    networks:
      app: { ipv4_address: 172.30.1.10 }
    volumes:
      - ./certs/reservamed.crt:/etc/nginx/certs/reservamed.crt:ro
      - ./certs/reservamed.key:/etc/nginx/certs/reservamed.key:ro
      - ./certs/ca.pem:/etc/nginx/certs/ca.pem:ro
    <<: [*endurecido, *solo_lectura]

networks:
  app:
    ipam:
      config: [{ subnet: 172.30.1.0/24 }]
  datos:
    internal: true
  correo: {}

volumes:
  sqldata:
  modelos:

# F5 (V6.4.1): un archivo por secreto en secretos/ (scripts/configurar-secretos.ps1; en .gitignore).
secrets:
  SA_PASSWORD: { file: ./secretos/SA_PASSWORD }
  SQL_API_PASS: { file: ./secretos/SQL_API_PASS }
  SQL_WORKER_PASS: { file: ./secretos/SQL_WORKER_PASS }
  SQL_ML_PASS: { file: ./secretos/SQL_ML_PASS }
  SQL_ML_SEED_PASS: { file: ./secretos/SQL_ML_SEED_PASS }
  SQL_TDE_PASS: { file: ./secretos/SQL_TDE_PASS }
  RABBIT_PASS: { file: ./secretos/RABBIT_PASS }
  RABBIT_API_PASS: { file: ./secretos/RABBIT_API_PASS }
  RABBIT_WORKER_PASS: { file: ./secretos/RABBIT_WORKER_PASS }
  RABBIT_ML_PASS: { file: ./secretos/RABBIT_ML_PASS }
  JWT_KEY: { file: ./secretos/JWT_KEY }
  TOTP_KEY: { file: ./secretos/TOTP_KEY }
  HUELLA_KEY: { file: ./secretos/HUELLA_KEY }
  BFF_SESSION_KEY: { file: ./secretos/BFF_SESSION_KEY }
  ML_API_KEY: { file: ./secretos/ML_API_KEY }
  WEBPAY_API_KEY: { file: ./secretos/WEBPAY_API_KEY }
