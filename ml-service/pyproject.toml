[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/eventos.py"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "S101",  # assert en pruebas
    "E702",  # estilo heredado; se limpia en F5
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]
"scripts/*" = ["S311"]   # datos sintéticos: random no criptográfico es correcto ahí
"app/sintetico.py" = ["S311"]
