# M9: AMQP solo cifrado. Sin listener en texto plano (5672).
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile   = /etc/rabbitmq/certs/rabbitmq.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/rabbitmq.key
ssl_options.verify     = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# Consola de administración solo en la red interna (el puerto no se publica al host).
management.tcp.port = 15672
loopback_users.guest = true
