# F5 (ASVS V9.2.2): SQL Server solo acepta conexiones cifradas con el certificado de la CA local.
# Los clientes (API, Worker, ml-service) fijan este mismo certificado (ServerCertificate).
[network]
tlscert = /etc/ssl/rm/sqlserver.crt
tlskey = /etc/ssl/rm/sqlserver.key
tlsprotocols = 1.2
forceencryption = 1
