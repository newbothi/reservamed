version: 2
updates:
  - package-ecosystem: nuget
    directory: /api-core
    schedule: { interval: weekly }
    groups:
      dotnet: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: [/bff, /portal, /backoffice, /e2e]
    schedule: { interval: weekly }
    groups:
      npm-menores: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /ml-service
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/bff, /ml-service, /nginx]
    schedule: { interval: monthly }
    ignore:
      # Node solo en versiones LTS (pares): 25 y 27 son "Current" y no reciben soporte largo.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
