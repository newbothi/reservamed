# ReservaMed v2 — integración continua (fase 0: base y quality gates).
# Bloquean el merge: dotnet, node, python, secretos, gitleaks y borde (gate de F1:
# verificaciones de borde, ZAP sin alertas altas y Trivy sin vulnerabilidades críticas).
# Informativo (pasa a bloqueante en F5): seguridad (SAST y auditorías de dependencias).
name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: .NET (build, unitarias, integración)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore api-core/ReservaMed.slnx
      - name: Build (advertencias visibles)
        run: dotnet build api-core/ReservaMed.slnx --no-restore -c Release
      - name: Pruebas unitarias
        run: >
          dotnet test api-core/tests/ReservaMed.UnitTests --no-build -c Release
          --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage"
          --results-directory TestResults/unit
      - name: Pruebas de integración (SQL Server en Testcontainers)
        run: >
          dotnet test api-core/tests/ReservaMed.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=integration.trx" --collect:"XPlat Code Coverage"
          --results-directory TestResults/integration
      - name: Pruebas fallidas como anotaciones
        if: failure()
        run: python3 scripts/ci/anotar.py trx $(find TestResults -name '*.trx')
      - name: Paquetes NuGet vulnerables (informativo)
        if: always()
        continue-on-error: true
        run: dotnet list api-core/ReservaMed.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-resultados
          path: TestResults/
          retention-days: 14

  node:
    name: Node (${{ matrix.proyecto }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        proyecto: [bff, portal, backoffice]
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.proyecto }}/package-lock.json
      - run: npm ci
      - name: Tipos y build
        run: npm run build
      - name: Pruebas con cobertura
        run: npm run test:cov
      - name: npm audit (informativo)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-${{ matrix.proyecto }}
          path: ${{ matrix.proyecto }}/coverage/
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: Python (ml-service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      - name: unixODBC (pyodbc lo necesita para importar)
        run: sudo apt-get update -q && sudo apt-get install -y -q unixodbc
      - run: pip install -r requirements-dev.txt
      - name: Ruff (estilo + reglas de seguridad bandit)
        run: ruff check . --output-format github
      - name: Pytest con cobertura
        run: python -m pytest --cov --cov-report=xml --cov-report=term
      - name: pip-audit (informativo)
        if: always()
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-ml
          path: ml-service/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  secretos:
    name: Script de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Sintaxis de todos los scripts PowerShell y solo ASCII (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $errores = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { Write-Output "::error file=scripts/$($f.Name),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $errores++ }
            if ([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) { Write-Output "::error file=scripts/$($f.Name)::Tiene caracteres no ASCII"; $errores++ }
          }
          if ($errores) { exit 1 }
      - name: Primera ejecución
        shell: pwsh
        run: ./scripts/configurar-secretos.ps1
      - name: Los .env existen, no tienen BOM y no usan valores publicados
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in '.env', 'ml-service/.env') {
            if (-not (Test-Path $f)) { throw "No se generó $f" }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($bytes[0] -eq 0xEF) { throw "$f tiene BOM: docker compose no lo leería bien" }
          }
          $vals = @{}
          Get-Content .env | Where-Object { $_ -match '^\s*([A-Z_]+)=(.*)$' } | ForEach-Object { $vals[$Matches[1]] = $Matches[2] }
          foreach ($k in 'SA_PASSWORD','JWT_KEY','ML_API_KEY','RABBIT_USER','RABBIT_PASS') {
            if (-not $vals[$k]) { throw "Falta $k en .env" }
          }
          if ($vals.JWT_KEY.Length -lt 32) { throw 'JWT_KEY demasiado corta' }
          if ($vals.ML_API_KEY.Length -lt 24) { throw 'ML_API_KEY demasiado corta' }
          foreach ($v in $vals.Values) {
            if ($v -in 'dev-ml-key-cambiar','ReservaMed_2026!','guest' -or $v.StartsWith('CAMBIAR')) { throw 'Hay un valor publicado en .env' }
          }
          "JWT_KEY=$($vals.JWT_KEY)" | Out-File -FilePath $env:RUNNER_TEMP/primera.txt
          $sec = dotnet user-secrets list --project api-core/src/ReservaMed.Api
          if (-not ($sec -match 'Jwt:Key') -or -not ($sec -match 'Ml:ApiKey')) { throw 'user-secrets incompleto' }
      - name: docker compose acepta el .env generado
        run: docker compose config -q
      - name: docker compose se niega a arrancar sin .env
        run: |
          mv .env .env.bak
          if docker compose config -q 2>/dev/null; then echo "compose aceptó la configuración sin secretos"; exit 1; fi
          mv .env.bak .env
      - name: -Forzar genera claves nuevas
        shell: pwsh
        run: |
          $antes = Get-Content $env:RUNNER_TEMP/primera.txt
          ./scripts/configurar-secretos.ps1 -Forzar
          $despues = (Get-Content .env | Where-Object { $_ -like 'JWT_KEY=*' })
          if ($antes -eq $despues) { throw 'Con -Forzar la clave JWT debía cambiar' }

  gitleaks:
    name: Gitleaks (secretos en el historial)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Escanear historial completo
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  borde:
    name: Borde (compose, ZAP, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [dotnet, node, python]
    steps:
      - uses: actions/checkout@v7
      - name: Certificados (openssl) y secretos
        shell: bash
        run: |
          bash scripts/generar-certificados.sh
          pwsh -NoProfile -File scripts/configurar-secretos.ps1 -SoloDocker
          grep -E '^SA_PASSWORD=' .env | sed 's/^/export /' >> "$RUNNER_TEMP/sa.env"
      - name: Construir y levantar
        run: docker compose up -d --build --quiet-pull
      - name: Esperar a que el sistema responda por HTTPS
        run: |
          for i in $(seq 1 90); do
            if curl -sf --cacert certs/ca.pem https://localhost/health >/dev/null && \
               docker compose logs ml-service 2>&1 | grep -q "Escuchando" && \
               docker compose logs worker 2>&1 | grep -q "Escuchando cola"; then
              echo "Sistema listo ($((i * 5)) s)"; exit 0
            fi
            sleep 5
          done
          echo "::error title=Arranque::El sistema no quedó listo en 7,5 minutos"
          exit 1
      - name: Segundo arranque idempotente (db-init y rabbit-init otra vez)
        run: |
          docker compose up -d --force-recreate --no-deps db-init rabbit-init
          for s in db-init rabbit-init; do
            docker wait "$(docker compose ps -a -q "$s")" >/dev/null
            code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -a -q "$s")")
            if [ "$code" != "0" ]; then
              echo "::error title=Idempotencia $s::Salió con código $code en el segundo arranque: $(docker compose logs --no-color --tail 15 "$s" | tr '\n' ' ')"
              exit 1
            fi
          done
      - name: Verificaciones de borde (C2 C4 A4 A5 M4 M8 M9)
        run: |
          source "$RUNNER_TEMP/sa.env"
          bash scripts/ci/verificar-borde.sh
      - name: ZAP baseline (portal y backoffice)
        if: success() || failure()
        run: |
          mkdir -p zap && chmod 777 zap
          for objetivo in "portal|https://reservamed.localhost/" "backoffice|https://reservamed.localhost/backoffice/"; do
            nombre=${objetivo%%|*}; url=${objetivo#*|}
            docker run --rm --network host --add-host reservamed.localhost:127.0.0.1 -v "$PWD/zap:/zap/wrk:rw" \
              zaproxy/zap-stable@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
              zap-baseline.py -t "$url" -m 2 -I -J "zap-$nombre.json" -r "zap-$nombre.html" > "zap/zap-$nombre.log" 2>&1 || true
            if [ ! -s "zap/zap-$nombre.json" ]; then
              echo "::warning title=ZAP $nombre sin reporte::$(tail -n 25 "zap/zap-$nombre.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            fi
          done
          python3 scripts/ci/anotar.py zap zap/zap-portal.json zap/zap-backoffice.json
      - name: Trivy api-core
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: reservamed-api-core, format: json, output: trivy-api-core.json, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "0", scanners: vuln }
      - name: Trivy worker
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: reservamed-worker, format: json, output: trivy-worker.json, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "0", scanners: vuln, skip-setup-trivy: true }
      - name: Trivy bff
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: reservamed-bff, format: json, output: trivy-bff.json, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "0", scanners: vuln, skip-setup-trivy: true }
      - name: Trivy ml-service
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: reservamed-ml-service, format: json, output: trivy-ml-service.json, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "0", scanners: vuln, skip-setup-trivy: true }
      - name: Trivy nginx
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: reservamed-nginx, format: json, output: trivy-nginx.json, severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "0", scanners: vuln, skip-setup-trivy: true }
      - name: Gate Trivy (sin críticas)
        if: success() || failure()
        run: python3 scripts/ci/anotar.py trivy trivy-*.json
      - name: Registros si algo falló
        if: failure()
        run: |
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | sed 's/^/::warning title=Estado::/'
          for s in $(docker compose ps -a --format '{{.Service}}'); do
            estado=$(docker compose ps -a --format '{{.State}} {{.ExitCode}}' "$s")
            if [[ "$estado" != "running 0" && "$estado" != "exited 0" ]] || [[ "$s" =~ ^(api-core|ml-service|worker|rabbit-init|db-init|ml-bootstrap)$ ]]; then
              logs=$(docker compose logs --no-color --tail 25 "$s" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::warning title=Logs $s ($estado)::$logs"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reportes-borde
          path: |
            zap/
            trivy-*.json
          retention-days: 14

  seguridad:
    name: Seguridad (informativo hasta F5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (dependencias, IaC y Dockerfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Semgrep (SAST)
        run: |
          pip install -q semgrep
          semgrep scan --config p/default --config p/owasp-top-ten --metrics=off --error || true
