# Resuelve el digest de imágenes base para fijarlas en Dockerfiles y compose (M4).
# Se ejecuta a mano; Dependabot mantiene los digests actualizados después.
name: Digests de imágenes

on:
  workflow_dispatch:
    inputs:
      imagenes:
        description: "Imágenes separadas por espacio"
        required: true
      comando:
        description: "Comando opcional dentro de cada imagen (p. ej. nginx -v)"
        required: false

permissions:
  contents: read

jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver digests
        env:
          IMAGENES: ${{ inputs.imagenes }}
          COMANDO: ${{ inputs.comando }}
        run: |
          for img in $IMAGENES; do
            d=$(docker buildx imagetools inspect "$img" --format '{{json .Manifest.Digest}}' 2>&1 | tr -d '"') || true
            extra=""
            if [ -n "$COMANDO" ]; then extra=" | $(docker run --rm --entrypoint sh "$img" -c "$COMANDO" 2>&1 | tr '\n' ' ')"; fi
            echo "::notice title=digest::$img@$d$extra"
          done
