# Configuración de gitleaks para ReservaMed.
# Se extienden las reglas por defecto. Sólo se permiten:
#  - los valores por defecto que estuvieron publicados en la v1: aparecen a propósito en la lista negra
#    (ValidacionSecretos.ValoresComprometidos) y en las pruebas que verifican que se rechazan;
#  - las claves de prueba de los proyectos de tests, que no protegen nada real.
title = "ReservaMed"

[extend]
useDefault = true

[[allowlists]]
description = "Valores comprometidos conocidos y claves de prueba"
paths = [
  '''^api-core/tests/''',
  '''^ml-service/tests/''',
  '''\.spec\.ts$''',
]
regexTarget = "match"
regexes = [
  '''CAMBIAR-esta-clave-de-desarrollo-ReservaMed-2026-minimo-32-bytes''',
  '''dev-ml-key-cambiar''',
  '''ReservaMed_2026!''',
  # Clave PÚBLICA del ambiente de integración de Transbank (comercio 597055555532, tarjetas de prueba).
  '''579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C''',
]

# Lista pública de contraseñas débiles que la política rechaza (M2). Excepción acotada: solo esa
# regla, ese archivo y líneas que son una lista de literales cortos entre comillas.
[[allowlists]]
description = "Lista de contraseñas comunes de PoliticaContrasenas"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^api-core/src/ReservaMed\.Api/Modules/Auth/PoliticaContrasenas\.cs$''']
regexTarget = "line"
# Sin anclas: en el historial gitleaks evalúa la línea del diff (empieza con "+").
regexes = ['''"password1234", "qwertyuiop12", "reservamed123"''']
